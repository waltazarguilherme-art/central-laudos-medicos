<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Laudos Médicos</title><style>body{font-family:system-ui;background:#f2f6fa;color:#17344c;margin:0}header{background:#12364f;color:white;padding:25px}main{max-width:950px;margin:25px auto;padding:15px}.card{background:white;border-radius:14px;padding:22px;margin:15px 0;box-shadow:0 2px 12px #0001}label{display:block;margin:12px 0 5px;font-weight:600}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #b9c9d6;border-radius:8px;font:inherit}textarea{min-height:100px}button{background:#086f96;color:white;padding:12px 16px;border:0;border-radius:8px;margin:8px 6px 0 0}.warning{background:#fff0c9;padding:15px;border-radius:10px}.report{white-space:pre-wrap;line-height:1.6}@media print{header,.form,.warning,button{display:none}.card{box-shadow:none}}</style><header><h1>Central de Laudos Médicos</h1>Editor estruturado de exames</header><main><div class="warning"><b>VERSÃO DE AVALIAÇÃO — NÃO OFICIAL.</b> Não insira dados reais de pacientes. Sem autenticação, armazenamento clínico seguro ou assinatura digital. Não emite laudos válidos.</div><div class="card form"><label>Categoria</label><select id="cat" onchange="loadExams()"></select><label>Exame</label><select id="exam" onchange="loadFields()"></select><label>Identificador fictício</label><input id="patient" placeholder="PACIENTE-EXEMPLO"><label>Data</label><input id="date" type="date"><div id="fields"></div><button onclick="preview()">Prévia</button><button onclick="preview();window.print()">Imprimir / PDF</button><button onclick="clearAll()">Limpar</button></div><div class="card"><h2>Prévia do laudo</h2><div id="out" class="report">Preencha os campos acima.</div></div></main><script>const db={'Análises clínicas':{'Hemograma':['Série vermelha','Série branca','Plaquetas','Observações'],'Glicemia':['Método','Resultado','Referência'],'Função renal':['Ureia','Creatinina','TFGe','Referências'],'Urina tipo I':['Aspecto','Química','Sedimento'],'Urocultura':['Material','Crescimento','Identificação','Antibiograma']},'Imagem':{'Radiografia':['Técnica','Achados','Conclusão'],'Ultrassonografia':['Região','Técnica','Achados','Conclusão'],'Tomografia':['Região','Técnica','Achados','Conclusão'],'Ressonância magnética':['Região','Sequências','Achados','Conclusão'],'Doppler':['Região','Técnica','Fluxos','Conclusão']},'Anatomia patológica':{'Biópsia':['Material','Macroscopia','Microscopia','Diagnóstico'],'Peça cirúrgica':['Material','Macroscopia','Microscopia','Margens','Diagnóstico'],'Citopatologia':['Material','Adequabilidade','Achados','Conclusão']},'Imuno-histoquímica':{'Painel de marcadores':['Amostra','Anticorpos e clones','Resultados','Controles','Interpretação']},'Endoscopia':{'Endoscopia digestiva alta':['Indicação','Esôfago','Estômago','Duodeno','Biópsias','Conclusão'],'Colonoscopia':['Indicação','Preparo','Extensão','Achados por segmento','Pólipos e procedimentos','Conclusão']},'Exames funcionais':{'ECG':['Ritmo','Frequência','Intervalos','Conclusão'],'Espirometria':['Técnica','Parâmetros','Interpretação']}};const $=x=>document.getElementById(x);Object.keys(db).forEach(x=>$('cat').add(new Option(x,x)));function loadExams(){$('exam').innerHTML='';Object.keys(db[$('cat').value]).forEach(x=>$('exam').add(new Option(x,x)));loadFields()}function loadFields(){$('fields').innerHTML='';db[$('cat').value][$('exam').value].forEach((x,i)=>{let l=document.createElement('label'),t=document.createElement('textarea');l.textContent=x;t.id='f'+i;t.placeholder='Preencher somente com achados verificados';$('fields').append(l,t)});preview()}function preview(){const lines=db[$('cat').value][$('exam').value].map((x,i)=>x.toUpperCase()+'\n'+($('f'+i).value.trim()||'[NÃO PREENCHIDO]')).join('\n\n');$('out').textContent='NÃO OFICIAL — SOMENTE AVALIAÇÃO\n\nExame: '+$('exam').value+'\nIdentificador fictício: '+($('patient').value||'Não informado')+'\nData: '+($('date').value||'Não informada')+'\n\n'+lines+'\n\nSEM VALIDADE CLÍNICA OU LEGAL.'}function clearAll(){if(confirm('Limpar formulário?')){$('patient').value='';$('date').value='';loadFields()}}loadExams()</script></html>
