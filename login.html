<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acesso administrativo — Central de Laudos</title><style>body{margin:0;font:16px system-ui;background:#edf3f8;color:#18354a}header{background:#14354d;color:white;padding:28px}main{max-width:520px;margin:40px auto;padding:16px}.card{background:white;border-radius:16px;padding:28px;box-shadow:0 8px 30px #1232}label{display:block;margin:20px 0 6px;font-weight:600}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #abc;border-radius:8px;font:inherit}button{margin-top:20px;padding:13px;width:100%;border:0;border-radius:8px;background:#08799c;color:white;font:inherit}button:disabled{background:#789}.status{padding:13px;border-radius:8px;background:#fff0c9;margin:15px 0}small{color:#567}a{color:#075f87}</style></head><body><header><h1>Central de Laudos Médicos</h1><div>Área administrativa</div></header><main><div class="card"><h2>Entrar na central</h2><p>Conta administrativa designada</p><label>E-mail</label><input value="guilhermenogueiranogueira00@gmail.com" readonly autocomplete="username"><label>Senha</label><input id="password" type="password" autocomplete="current-password" placeholder="Senha administrativa"><button id="enter" disabled>Entrar</button><p class="status" id="status">Verificando configuração de acesso…</p><small>O acesso clínico permanece bloqueado até configuração e validação da autenticação e do armazenamento protegido.</small><p><a href="/catalogo.html">Abrir catálogo de avaliação sem dados reais</a></p></div></main><script>async function init(){try{const r=await fetch('/api/auth/status',{cache:'no-store'});const j=await r.json();const status=document.getElementById('status');if(j.configured){status.textContent='Acesso administrativo configurado. Entre com sua senha.';document.getElementById('enter').disabled=false}else{status.textContent='Acesso ainda não ativado: falta configurar a credencial segura no servidor. Não insira dados reais.'}}catch{document.getElementById('status').textContent='Não foi possível verificar o acesso.'}}document.getElementById('enter').onclick=async()=>{const pass=document.getElementById('password');const status=document.getElementById('status');const button=document.getElementById('enter');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:'guilhermenogueiranogueira00@gmail.com',password:pass.value})});pass.value='';if(r.ok){location.href='/admin'}else{status.textContent='Não foi possível entrar. Verifique a configuração ou a senha.'}}catch{status.textContent='Erro de conexão.'}button.disabled=false};init()</script></body></html>
